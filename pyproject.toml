[project]
name = "consulting-intelligence-agent"
version = "0.1.0"
description = "Evidence-grounded requirement lifecycle management"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "sqlalchemy==2.0.35",
    "openai==1.109.1",
    "PyYAML==6.0.3",
    "Jinja2==3.1.6",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "hypothesis==6.115.5",
    "httpx==0.28.1",
    "ruff==0.7.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.vercel]
entrypoint = "src.api.hosted:app"

[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"

# CORS middleware would otherwise keep the UI inside the function. Promote the
# Vite build to the CDN; API routes still hit the function.
[tool.vercel.fastapi.static]
cdn = true
exclude = true

[tool.pytest.ini_options]
testpaths = ["src/engine", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
